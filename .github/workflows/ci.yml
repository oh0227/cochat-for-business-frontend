name: CI

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: service-frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: service-frontend/package-lock.json

      - run: npm ci
      - run: npm run lint

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: service-frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_FRONTEND_URL: ${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}

  notify:
    name: Discord 알림
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: CI 성공
        if: ${{ !contains(needs.*.result, 'failure') }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          nodetail: true
          title: "CoChat Frontend CI"
          description: |
            ✅ **CI 통과**

            📦 `${{ github.repository }}`
            🌿 `${{ github.ref_name }}` ← `${{ github.actor }}`
            💬 ${{ github.event.head_commit.message }}

            🔗 [GitHub](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          color: 0x57f287

      - name: CI 실패
        if: ${{ contains(needs.*.result, 'failure') }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          nodetail: true
          title: "CoChat Frontend CI"
          description: |
            ❌ **CI 실패**

            📦 `${{ github.repository }}`
            🌿 `${{ github.ref_name }}` ← `${{ github.actor }}`
            💬 ${{ github.event.head_commit.message }}

            🔗 [GitHub](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) | [로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: 0xff0000
